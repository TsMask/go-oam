<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket 客户端测试</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .connection-section {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 8px;
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 2px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-weight: 500;
            color: #555;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 200px;
            gap: 15px;
            margin-bottom: 15px;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e1e1e1;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.3s;
        }

        input[type="text"]:focus,
        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(17, 153, 142, 0.4);
        }

        .btn-danger {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
            color: white;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(235, 51, 73, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: white;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #dc3545;
            animation: pulse 2s infinite;
        }

        .status-dot.connected {
            background: #28a745;
        }

        .status-dot.connecting {
            background: #ffc107;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .metric-card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border: 2px solid #e1e1e1;
        }

        .metric-card.success {
            border-color: #28a745;
        }

        .metric-card.error {
            border-color: #dc3545;
        }

        .metric-value {
            font-size: 24px;
            font-weight: 700;
            color: #333;
        }

        .metric-label {
            font-size: 12px;
            color: #777;
            margin-top: 5px;
        }

        .message-section {
            margin-top: 30px;
        }

        .message-form {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e1e1e1;
            border-radius: 6px;
            font-size: 14px;
            font-family: 'Courier New', monospace;
            resize: vertical;
            min-height: 100px;
            transition: all 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .message-log {
            background: #1e1e1e;
            border-radius: 8px;
            padding: 20px;
            max-height: 500px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }

        .message-item {
            margin-bottom: 12px;
            padding: 12px;
            border-radius: 6px;
            line-height: 1.5;
        }

        .message-item.sent {
            background: #2d5a27;
            border-left: 4px solid #28a745;
        }

        .message-item.received {
            background: #1e3a5f;
            border-left: 4px solid #667eea;
        }

        .message-item.error {
            background: #5a1e1e;
            border-left: 4px solid #dc3545;
        }

        .message-item.system {
            background: #3a3a1e;
            border-left: 4px solid #ffc107;
            font-style: italic;
        }

        .message-time {
            color: #888;
            font-size: 11px;
            margin-bottom: 5px;
        }

        .message-type {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: 600;
            margin-right: 8px;
        }

        .message-type.request {
            background: #28a745;
            color: white;
        }

        .message-type.response {
            background: #667eea;
            color: white;
        }

        .message-type.error {
            background: #dc3545;
            color: white;
        }

        .message-seq {
            color: #ffd700;
            font-weight: 600;
        }

        .message-content {
            color: #e0e0e0;
            word-break: break-all;
            margin-top: 5px;
        }

        .clear-btn {
            margin-top: 15px;
        }

        .performance-section {
            margin-top: 30px;
            background: #f8f9fa;
            padding: 25px;
            border-radius: 8px;
        }

        .perf-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 15px;
        }

        .perf-item {
            background: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            border: 2px solid #e1e1e1;
            transition: all 0.3s;
        }

        .perf-item:hover {
            border-color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
        }

        .perf-value {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .perf-label {
            font-size: 14px;
            color: #777;
            margin-top: 8px;
        }

        .perf-unit {
            font-size: 14px;
            color: #999;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .empty-state-text {
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔌 WebSocket 客户端测试工具</h1>
            <p>基于 go-oam/ws 的高性能 WebSocket 客户端 SDK</p>
        </div>

        <div class="content">
            <!-- 连接管理 -->
            <div class="connection-section">
                <div class="section-title">连接管理</div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>服务器地址</label>
                        <input type="text" id="serverUrl" value="ws://localhost:9092" placeholder="ws://localhost:8080">
                    </div>
                    <div class="form-group">
                        <label>&nbsp;</label>
                        <div class="button-group">
                            <button id="connectBtn" class="btn btn-success" onclick="wsClient.connect()">
                                <span>连接</span>
                            </button>
                            <button id="disconnectBtn" class="btn btn-danger" onclick="wsClient.disconnect()" disabled>
                                <span>断开</span>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="status-indicator">
                    <div id="statusDot" class="status-dot"></div>
                    <span id="statusText">未连接</span>
                </div>

                <div class="metrics-grid" id="metricsGrid">
                    <div class="metric-card">
                        <div class="metric-value" id="totalSent">0</div>
                        <div class="metric-label">发送消息</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-value" id="totalReceived">0</div>
                        <div class="metric-label">接收消息</div>
                    </div>
                    <div class="metric-card success">
                        <div class="metric-value" id="successCount">0</div>
                        <div class="metric-label">成功</div>
                    </div>
                    <div class="metric-card error">
                        <div class="metric-value" id="errorCount">0</div>
                        <div class="metric-label">失败</div>
                    </div>
                </div>
            </div>

            <!-- 消息发送 -->
            <div class="message-section">
                <div class="section-title">消息交互</div>

                <div class="message-form">
                    <div class="form-group">
                        <label>消息类型</label>
                        <input type="text" id="msgAction" value="echo" placeholder="动作类型，如: echo">
                    </div>

                    <div class="form-group">
                        <label>消息内容 (JSON 格式)</label>
                        <textarea id="msgData" placeholder='{"message": "Hello World"}'>{"message": "Hello WebSocket!"}</textarea>
                    </div>

                    <div class="form-group">
                        <label>发送次数 (性能测试)</label>
                        <input type="number" id="sendCount" value="1" min="1" max="10000" placeholder="发送次数">
                    </div>

                    <div class="button-group">
                        <button class="btn btn-primary" onclick="sendMessage()">
                            <span>📤 发送消息</span>
                        </button>
                        <button class="btn btn-secondary" onclick="sendBatch()">
                            <span>🚀 批量发送</span>
                        </button>
                        <button class="btn btn-secondary" onclick="startPerfTest()">
                            <span>⚡ 性能测试</span>
                        </button>
                    </div>
                </div>

                <div id="messageLog" class="message-log">
                    <div class="empty-state">
                        <div class="empty-state-icon">📨</div>
                        <div class="empty-state-text">暂无消息记录</div>
                    </div>
                </div>

                <button class="btn btn-secondary clear-btn" onclick="clearMessages()">
                    <span>🗑️ 清空日志</span>
                </button>
            </div>

            <!-- 性能指标 -->
            <div class="performance-section">
                <div class="section-title">性能指标</div>

                <div class="perf-grid">
                    <div class="perf-item">
                        <div class="perf-value" id="qps">0</div>
                        <div class="perf-label">QPS</div>
                        <div class="perf-unit">每秒请求数</div>
                    </div>
                    <div class="perf-item">
                        <div class="perf-value" id="avgLatency">0</div>
                        <div class="perf-label">平均延迟</div>
                        <div class="perf-unit">毫秒</div>
                    </div>
                    <div class="perf-item">
                        <div class="perf-value" id="successRate">0%</div>
                        <div class="perf-label">成功率</div>
                        <div class="perf-unit">百分比</div>
                    </div>
                    <div class="perf-item">
                        <div class="perf-value" id="totalTime">0</div>
                        <div class="perf-label">总耗时</div>
                        <div class="perf-unit">毫秒</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        class WebSocketClient {
            constructor() {
                this.ws = null;
                this.seq = 0;
                this.pendingRequests = new Map();
                this.metrics = {
                    totalSent: 0,
                    totalReceived: 0,
                    successCount: 0,
                    errorCount: 0,
                    startTime: null,
                    latencies: []
                };
                this.reconnectAttempts = 0;
                this.maxReconnectAttempts = 5;
                this.reconnectDelay = 2000;
            }

            connect() {
                const serverUrl = document.getElementById('serverUrl').value;
                if (!serverUrl) {
                    this.log('请输入服务器地址', 'error');
                    return;
                }

                this.updateStatus('connecting');
                this.log(`正在连接 ${serverUrl}...`, 'system');

                try {
                    this.ws = new WebSocket(serverUrl);

                    this.ws.onopen = () => {
                        this.reconnectAttempts = 0;
                        this.updateStatus('connected');
                        this.log('连接成功！', 'system');
                        document.getElementById('connectBtn').disabled = true;
                        document.getElementById('disconnectBtn').disabled = false;
                    };

                    this.ws.onmessage = (event) => {
                        this.handleMessage(event.data);
                    };

                    this.ws.onerror = (error) => {
                        this.log('WebSocket 错误: ' + (error.message || '未知错误'), 'error');
                        this.metrics.errorCount++;
                        this.updateMetrics();
                    };

                    this.ws.onclose = (event) => {
                        this.updateStatus('disconnected');
                        this.log(`连接关闭 (代码: ${event.code})`, 'system');
                        document.getElementById('connectBtn').disabled = false;
                        document.getElementById('disconnectBtn').disabled = true;
                        
                        if (this.reconnectAttempts < this.maxReconnectAttempts && event.code !== 1000) {
                            this.reconnectAttempts++;
                            this.log(`${this.reconnectDelay/1000}秒后尝试重连 (${this.reconnectAttempts}/${this.maxReconnectAttempts})`, 'system');
                            setTimeout(() => this.connect(), this.reconnectDelay);
                        }
                    };

                } catch (error) {
                    this.log('连接失败: ' + error.message, 'error');
                    this.updateStatus('disconnected');
                }
            }

            disconnect() {
                if (this.ws) {
                    this.log('正在断开连接...', 'system');
                    this.ws.close(1000, 'Client disconnected');
                    this.ws = null;
                }
            }

            send(message) {
                if (!this.ws || this.ws.readyState !== WebSocket.OPEN) {
                    this.log('连接未建立或已关闭', 'error');
                    return false;
                }

                try {
                    this.ws.send(message);
                    return true;
                } catch (error) {
                    this.log('发送消息失败: ' + error.message, 'error');
                    return false;
                }
            }

            handleMessage(data) {
                try {
                    const response = JSON.parse(data);
                    this.metrics.totalReceived++;

                    if (response.seq) {
                        const pending = this.pendingRequests.get(response.seq);
                        if (pending) {
                            const latency = Date.now() - pending.timestamp;
                            this.metrics.latencies.push(latency);
                            this.pendingRequests.delete(response.seq);
                        }
                    }

                    if (response.code === 0 || response.code === 200) {
                        this.metrics.successCount++;
                        this.log(`收到响应: seq=${response.seq} code=${response.code}`, 'received', response);
                    } else {
                        this.metrics.errorCount++;
                        this.log(`错误响应: seq=${response.seq} code=${response.code} msg=${response.msg || '未知错误'}`, 'error', response);
                    }

                    this.updateMetrics();

                } catch (error) {
                    this.log('解析响应失败: ' + error.message, 'error');
                    this.metrics.errorCount++;
                    this.updateMetrics();
                }
            }

            request(type, data) {
                const request = {
                    id: this.generateUUID(),
                    seq: ++this.seq,
                    type: type,
                    data: typeof data === 'string' ? this.stringToBytes(data) : data
                };

                const message = JSON.stringify(request);
                
                if (!this.send(message)) {
                    return false;
                }

                this.metrics.totalSent++;
                this.pendingRequests.set(request.seq, {
                    timestamp: Date.now(),
                    request: request
                });

                this.log(`发送请求: seq=${request.seq} type=${type}`, 'sent', request);
                this.updateMetrics();

                return true;
            }

            generateUUID() {
                return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                    const r = Math.random() * 16 | 0;
                    const v = c === 'x' ? r : (r & 0x3 | 0x8);
                    return v.toString(16);
                });
            }

            stringToBytes(str) {
                try {
                    return JSON.parse(str);
                } catch {
                    return new TextEncoder().encode(str);
                }
            }

            updateStatus(status) {
                const statusDot = document.getElementById('statusDot');
                const statusText = document.getElementById('statusText');

                statusDot.className = 'status-dot';
                if (status === 'connected') {
                    statusDot.classList.add('connected');
                    statusText.textContent = '已连接';
                } else if (status === 'connecting') {
                    statusDot.classList.add('connecting');
                    statusText.textContent = '连接中...';
                } else {
                    statusText.textContent = '未连接';
                }
            }

            updateMetrics() {
                document.getElementById('totalSent').textContent = this.metrics.totalSent;
                document.getElementById('totalReceived').textContent = this.metrics.totalReceived;
                document.getElementById('successCount').textContent = this.metrics.successCount;
                document.getElementById('errorCount').textContent = this.metrics.errorCount;

                if (this.metrics.totalSent > 0) {
                    const successRate = (this.metrics.successCount / this.metrics.totalSent * 100).toFixed(1);
                    document.getElementById('successRate').textContent = successRate + '%';
                }

                if (this.metrics.latencies.length > 0) {
                    const avgLatency = Math.round(
                        this.metrics.latencies.reduce((a, b) => a + b, 0) / this.metrics.latencies.length
                    );
                    document.getElementById('avgLatency').textContent = avgLatency;
                }

                if (this.metrics.startTime && this.metrics.totalSent > 0) {
                    const elapsed = Date.now() - this.metrics.startTime;
                    const qps = (this.metrics.totalSent / (elapsed / 1000)).toFixed(2);
                    document.getElementById('qps').textContent = qps;
                    document.getElementById('totalTime').textContent = elapsed;
                }
            }

            log(message, type = 'system', data = null) {
                const logContainer = document.getElementById('messageLog');
                
                if (logContainer.querySelector('.empty-state')) {
                    logContainer.innerHTML = '';
                }

                const logItem = document.createElement('div');
                logItem.className = `message-item ${type}`;

                const time = new Date().toLocaleTimeString('zh-CN', { hour12: false });
                let html = `<div class="message-time">${time}</div>`;

                if (type === 'sent' || type === 'received') {
                    const typeLabel = type === 'sent' ? '请求' : '响应';
                    const typeClass = type === 'sent' ? 'request' : 'response';
                    html += `<div><span class="message-type ${typeClass}">${typeLabel}</span>${message}</div>`;
                } else if (type === 'error') {
                    html += `<div><span class="message-type error">错误</span>${message}</div>`;
                } else {
                    html += `<div>${message}</div>`;
                }

                if (data) {
                    html += `<div class="message-content">${JSON.stringify(data, null, 2)}</div>`;
                }

                logItem.innerHTML = html;
                logContainer.appendChild(logItem);
                logContainer.scrollTop = logContainer.scrollHeight;
            }

            clearLogs() {
                const logContainer = document.getElementById('messageLog');
                logContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📨</div>
                        <div class="empty-state-text">暂无消息记录</div>
                    </div>
                `;
            }

            resetMetrics() {
                this.metrics = {
                    totalSent: 0,
                    totalReceived: 0,
                    successCount: 0,
                    errorCount: 0,
                    startTime: null,
                    latencies: []
                };
                this.updateMetrics();
                document.getElementById('qps').textContent = '0';
                document.getElementById('avgLatency').textContent = '0';
                document.getElementById('successRate').textContent = '0%';
                document.getElementById('totalTime').textContent = '0';
            }
        }

        const wsClient = new WebSocketClient();

        function sendMessage() {
            const msgAction = document.getElementById('msgAction').value || 'echo';
            const msgData = document.getElementById('msgData').value;

            if (!msgData.trim()) {
                wsClient.log('请输入消息内容', 'error');
                return;
            }

            wsClient.request(msgAction, msgData);
        }

        function sendBatch() {
            const count = parseInt(document.getElementById('sendCount').value) || 1;
            const msgAction = document.getElementById('msgAction').value || 'echo';
            const msgData = document.getElementById('msgData').value;

            if (!msgData.trim()) {
                wsClient.log('请输入消息内容', 'error');
                return;
            }

            if (count < 1 || count > 10000) {
                wsClient.log('发送次数必须在 1-10000 之间', 'error');
                return;
            }

            wsClient.resetMetrics();
            wsClient.metrics.startTime = Date.now();

            let sent = 0;
            const interval = setInterval(() => {
                if (sent >= count || !wsClient.ws || wsClient.ws.readyState !== WebSocket.OPEN) {
                    clearInterval(interval);
                    if (sent < count) {
                        wsClient.log(`发送中断，已发送 ${sent}/${count} 条消息`, 'error');
                    } else {
                        wsClient.log(`批量发送完成: ${sent} 条消息`, 'system');
                    }
                    return;
                }

                wsClient.request(msgAction, msgData);
                sent++;
            }, 10);

            wsClient.log(`开始批量发送 ${count} 条消息...`, 'system');
        }

        function startPerfTest() {
            const count = 1000;
            const msgAction = 'echo';
            const msgData = document.getElementById('msgData').value || '{"message": "perf-test"}';

            wsClient.resetMetrics();
            wsClient.metrics.startTime = Date.now();

            wsClient.log(`开始性能测试 (${count} 条请求)...`, 'system');

            const startTime = Date.now();
            let sent = 0;
            let completed = 0;

            const checkCompletion = setInterval(() => {
                if (completed >= count) {
                    clearInterval(checkCompletion);
                    const duration = Date.now() - startTime;
                    const qps = (count / (duration / 1000)).toFixed(2);
                    
                    wsClient.log(`性能测试完成！`, 'system');
                    wsClient.log(`总耗时: ${duration}ms`, 'system');
                    wsClient.log(`QPS: ${qps}`, 'system');
                    wsClient.log(`成功率: ${(wsClient.metrics.successCount / count * 100).toFixed(2)}%`, 'system');
                    return;
                }

                if (sent < count && wsClient.ws && wsClient.ws.readyState === WebSocket.OPEN) {
                    const batchSize = 100;
                    for (let i = 0; i < batchSize && sent < count; i++) {
                        wsClient.request(msgAction, msgData);
                        sent++;
                        completed++;
                    }
                }
            }, 50);
        }

        function clearMessages() {
            wsClient.clearLogs();
            wsClient.resetMetrics();
            wsClient.log('日志已清空', 'system');
        }

        document.getElementById('msgData').addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
